name: Build VideoStar-Pro IPA

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

jobs:
  build-pro:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid 2>/dev/null || true

      - name: Setup iOS SDK
        run: |
          set -e
          mkdir -p $HOME/theos/sdks
          XSDK="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          SDK=$(ls "$XSDK" 2>/dev/null | grep iPhoneOS | head -1)
          if [ -n "$SDK" ]; then
            ln -sf "$XSDK/$SDK" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
            echo "SDK linked: $SDK"
          else
            curl -fsSL "https://github.com/theos/sdks/archive/master.tar.gz" | \
              tar -xz --strip-components=1 -C "$HOME/theos/sdks" 2>/dev/null || true
          fi

      - name: Build VdsProUnlock.dylib
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          make FINALPACKAGE=1 DEBUG=0 -j$(sysctl -n hw.ncpu) 2>&1

      - name: Find dylib
        id: dylib
        run: |
          D=$(find .theos/obj -name "*.dylib" 2>/dev/null | head -1)
          [ -z "$D" ] && D=$(find . -name "VdsProUnlock.dylib" 2>/dev/null | head -1)
          [ -z "$D" ] && { echo "dylib not found"; find . -name "*.dylib" 2>/dev/null; exit 1; }
          echo "path=$D" >> $GITHUB_OUTPUT
          echo "Found: $D"
          echo "Checking dynamic libraries dependencies:"
          otool -L "$D"

      - name: Build insert_dylib
        run: |
          set -e
          git clone --depth=1 https://github.com/Tyilo/insert_dylib.git /tmp/idylib
          xcodebuild -project /tmp/idylib/insert_dylib.xcodeproj \
            -scheme insert_dylib -configuration Release \
            CONFIGURATION_BUILD_DIR=/tmp/idylib/bin -quiet 2>&1 | tail -3
          BIN=$(find /tmp/idylib/bin -name insert_dylib -type f | head -1)
          sudo cp "$BIN" /usr/local/bin/insert_dylib && chmod +x /usr/local/bin/insert_dylib

      - name: Download base IPA
        run: |
          set -e
          echo "Downloading VideoStar_base.ipa via GitHub API..."
          ASSET_URL=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/tp307228-droid/Vds-Pro/releases/tags/base-ipa" | \
            python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              if a['name'].endswith('.ipa'):
                  print(a['url']); break
          ")
          echo "Asset API URL: $ASSET_URL"
          [ -z "$ASSET_URL" ] && { echo "Cannot find base IPA asset"; exit 1; }
          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o base.ipa --retry 3 --retry-delay 5
          [ ! -s "base.ipa" ] && { echo "Downloaded file is empty"; exit 1; }
          echo "Downloaded: $(du -sh base.ipa | cut -f1)"

      - name: Extract IPA
        run: |
          set -e
          mkdir -p extracted
          unzip -q base.ipa -d extracted
          APP=$(find extracted/Payload -name "*.app" -maxdepth 1 | head -1)
          [ -z "$APP" ] && { echo "No .app found"; exit 1; }
          EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BINARY=$APP/$EXEC" >> $GITHUB_ENV
          echo "App: $APP | Binary: $EXEC"

      - name: Inject VdsProUnlock.dylib
        run: |
          set -e
          DYLIB="${{ steps.dylib.outputs.path }}"
          cp "$DYLIB" "$APP/VdsProUnlock.dylib"
          insert_dylib --strip-codesig --all-yes \
            "@executable_path/VdsProUnlock.dylib" "$BINARY" "$BINARY"
          echo "Injected! Load cmds:"
          otool -L "$BINARY" | grep -E "VdsPro|executable"

      - name: Repack Pro IPA
        run: |
          set -e
          cd extracted && zip -qr ../VideoStar-Pro.ipa Payload/ && cd ..
          echo "Pro IPA: $(du -sh VideoStar-Pro.ipa | cut -f1)"

      - name: Release VideoStar-Pro.ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pro-latest
          name: "VideoStar Pro (Build ${{ github.run_number }})"
          body: |
            VideoStar Pro — VdsProUnlock injected.
            **Dùng file này với VideoStar-Mod để có FallVds Tool.**
            Discord: [discord.gg/swaggang](https://discord.gg/swaggang)
          files: VideoStar-Pro.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
