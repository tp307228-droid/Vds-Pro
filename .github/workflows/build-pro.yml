name: 🔓 Build VideoStar Pro IPA

# ─────────────────────────────────────────────────────────
# Repo: https://github.com/tp307228-droid/Vds-Pro
#
# Flow:
#   1. Checkout repo (has VideoStar_base.ipa committed)
#   2. Setup Theos + iOS SDK
#   3. Build VdsProUnlock.dylib
#   4. Extract base IPA → inject dylib → repack
#   5. Publish VideoStar-Pro.ipa as GitHub Release
#      (VideoStar-Mod workflow will pull this)
# ─────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build-pro:
    name: Build & Inject Pro Unlock
    runs-on: macos-14

    steps:
      # ── 1. Checkout ────────────────────────────────────
      - name: 📥 Checkout Vds-Pro
        uses: actions/checkout@v4

      # ── 2. Setup Theos ─────────────────────────────────
      - name: ⚙️ Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: 📱 Link iOS SDK
        run: |
          set -e
          mkdir -p $HOME/theos/sdks

          # Try Xcode SDK first
          XSDK="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          FOUND_SDK=$(ls "$XSDK" 2>/dev/null | grep "iPhoneOS" | head -1)

          if [ -n "$FOUND_SDK" ]; then
            ln -sf "$XSDK/$FOUND_SDK" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
            echo "✅ Linked SDK: $FOUND_SDK"
          else
            # Download prebuilt SDK
            echo "⬇️ Downloading prebuilt SDK..."
            curl -fsSL "https://github.com/theos/sdks/archive/master.tar.gz" | \
              tar -xz --strip-components=1 -C "$HOME/theos/sdks" 2>/dev/null || true
            echo "✅ Downloaded SDK"
          fi

          ls $HOME/theos/sdks/

      # ── 3. Build VdsProUnlock.dylib ────────────────────
      - name: 🔨 Build VdsProUnlock.dylib
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"

          # Verify source exists
          if [ ! -f "VdsPro/VdsProUnlock.x" ]; then
            echo "❌ VdsProUnlock.x not found!"
            exit 1
          fi

          make package FINALPACKAGE=1 DEBUG=0 -j$(sysctl -n hw.ncpu) 2>&1
          echo "✅ Build complete"

      - name: 🔍 Find dylib
        id: find_dylib
        run: |
          set -e
          # Theos outputs dylib in .theos/obj/
          DYLIB=$(find .theos/obj -name "*.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "VdsProUnlock.dylib" 2>/dev/null | head -1)
          fi
          if [ -z "$DYLIB" ]; then
            echo "❌ dylib not found! Listing build artifacts:"
            find . -name "*.dylib" 2>/dev/null || true
            find .theos -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "✅ Found: $DYLIB"
          echo "dylib=$DYLIB" >> $GITHUB_OUTPUT

      # ── 4. Install insert_dylib ────────────────────────
      - name: 🔧 Build insert_dylib
        run: |
          set -e
          git clone --depth=1 https://github.com/Tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild \
            -project insert_dylib.xcodeproj \
            -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=/tmp/insert_dylib/bin \
            -quiet 2>&1 | tail -5
          BINARY=$(find /tmp/insert_dylib/bin -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "❌ insert_dylib build failed"
            exit 1
          fi
          sudo cp "$BINARY" /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib
          echo "✅ insert_dylib ready: $(insert_dylib --help 2>&1 | head -1)"

      # ── 5. Extract base IPA ────────────────────────────
      - name: 📦 Extract base IPA
        run: |
          set -e
          # Find the base IPA in repo
          BASE_IPA=$(find . -name "*.ipa" -not -name "*Pro*" -not -name "*Mod*" | head -1)
          if [ -z "$BASE_IPA" ]; then
            echo "❌ Base IPA not found in repo!"
            echo "Please commit VideoStar_base.ipa to this repo"
            exit 1
          fi
          echo "📦 Base IPA: $BASE_IPA ($(du -sh "$BASE_IPA" | cut -f1))"

          mkdir -p extracted
          unzip -q "$BASE_IPA" -d extracted
          echo "✅ Extracted"

          # Find .app bundle
          APP=$(find extracted/Payload -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "❌ .app not found in IPA"
            exit 1
          fi
          echo "📱 App: $APP"
          echo "APP=$APP" >> $GITHUB_ENV

          # Get binary name
          EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          echo "🔑 Binary: $EXEC"
          echo "BINARY=$APP/$EXEC" >> $GITHUB_ENV

      # ── 6. Inject VdsProUnlock.dylib ───────────────────
      - name: 💉 Inject VdsProUnlock.dylib
        run: |
          set -e
          DYLIB="${{ steps.find_dylib.outputs.dylib }}"

          echo "📋 Pre-inject binary info:"
          otool -L "$BINARY" | head -10

          # Copy dylib into app bundle
          cp "$DYLIB" "$APP/VdsProUnlock.dylib"
          echo "✅ Copied dylib to app bundle"

          # Inject load command
          insert_dylib \
            --strip-codesig \
            --all-yes \
            "@executable_path/VdsProUnlock.dylib" \
            "$BINARY" \
            "$BINARY"

          echo "✅ Injected!"
          echo "📋 Post-inject:"
          otool -L "$BINARY" | grep -E "VdsPro|executable"

      # ── 7. Repack as Pro IPA ───────────────────────────
      - name: 📦 Repack Pro IPA
        run: |
          set -e
          cd extracted
          zip -qr ../VideoStar-Pro.ipa Payload/
          cd ..
          echo "✅ Repacked"
          echo "📦 Pro IPA: $(du -sh VideoStar-Pro.ipa)"

      # ── 8. Upload artifact (for VideoStar-Mod to pull) ─
      - name: ⬆️ Upload Pro IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStar-Pro
          path: VideoStar-Pro.ipa
          retention-days: 7

      # ── 9. Create GitHub Release ───────────────────────
      - name: 🚀 Release VideoStar-Pro.ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pro-v${{ github.run_number }}
          name: "🔓 VideoStar Pro v15.2.3 (Build ${{ github.run_number }})"
          body: |
            ## 🔓 VideoStar Pro — Unlocked

            > **IPA này CHƯA có FallVds Tool**
            > Để có cả Pro + FallVds Tool → tải từ [VideoStar-Mod](https://github.com/tp307228-droid/VideoStar-Mod/releases)

            ### ✅ Đã mở khóa:
            - Toàn bộ hiệu ứng Pro & VIP
            - Xuất video không giới hạn
            - Tất cả preset & templates
            - Không watermark
            - Tất cả QR effects

            ### 📲 Cách cài:
            Ký bằng **eSign / AltStore / Sideloadly / TrollStore**

            ---
            **Build:** `${{ github.sha }}` | **Discord:** [discord.gg/swaggang](https://discord.gg/swaggang)
          files: VideoStar-Pro.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
